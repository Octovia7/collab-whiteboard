# Render Blueprint for the public demo: one free web service (the server, which also serves the
# built client) and a free Key Value instance (Redis). Postgres is Neon's free tier; its
# connection string is entered in Render's dashboard, never committed. Step by step: docs/deploy.md.
#
# Free-plan limits (see docs/deploy.md and the README): one replica on 0.1 CPU / 512 MB, sleeps
# after 15 minutes without traffic (about a minute to wake), Key Value is in memory only.
services:
  - type: web
    name: collab-whiteboard
    runtime: docker
    plan: free
    region: oregon # keep Neon in the same region (AWS us-west-2)
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Render's proxy terminates HTTPS in front of us: trust its X-Forwarded-For for per-IP limits.
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      # Generated by Render (256-bit random), shown only in its dashboard.
      - key: JWT_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: collab-whiteboard-kv
          property: connectionString
      # Entered in the dashboard (sync: false = never in this file).
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: keyvalue
    name: collab-whiteboard-kv
    plan: free
    region: oregon
    # Never evict: an evicted seq counter is covered by the floor, but an evicted revoked session
    # would let a logged-out token back in. When full, writes fail and the app fails closed.
    maxmemoryPolicy: noeviction
    # Reachable only from services in this Render account.
    ipAllowList: []
