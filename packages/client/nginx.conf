# Serves the built client and proxies the API and WebSocket to the server, so the browser
# sees one origin (cookies, CORS and the CSP stay simple).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# `server` resolves to every server replica. A replica that fails a connect is skipped for 10 s.
upstream whiteboard_server {
  server server:3001 max_fails=1 fail_timeout=10s;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers. nginx drops these inherited headers in any location that sets its own
  # `add_header`, so the locations below that add headers repeat them.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location /api/ {
    proxy_pass http://whiteboard_server;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # A replica on the internal network answers a connect in well under a millisecond; one that
    # crashed may not answer at all. Give up fast and let nginx try the next replica.
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
  }

  location = /ws {
    proxy_pass http://whiteboard_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Fail over fast when a replica is down (the default connect timeout is 60 s, which kept
    # reconnecting clients waiting on a killed replica for a minute; found by the chaos test).
    proxy_connect_timeout 2s;
    # Idle sockets stay open (clients also send a heartbeat every 5 s).
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Fingerprinted build assets: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Health, readiness and metrics are for the internal network only, never the public proxy.
  location ~ ^/(healthz|readyz|metrics)$ {
    return 404;
  }

  # Single-page app: every other path is the app shell, never cached.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri /index.html;
  }
}
